<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --table-stripe: #182234;
      --table-hover: #26354a;
      --code-bg: #090d16;
      --radius: 8px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #0284c7;
        --accent-hover: #0369a1;
        --success: #059669;
        --warning: #d97706;
        --danger: #dc2626;
        --table-stripe: #f1f5f9;
        --table-hover: #e2e8f0;
        --code-bg: #f1f5f9;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1.5rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
      color: var(--accent-hover);
    }
    .link-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      font-size: 0.78rem;
      color: var(--accent);
      text-decoration: none;
      margin-right: 0.35rem;
      white-space: nowrap;
    }
    .link-pill:hover {
      border-color: var(--accent);
      background: var(--table-hover);
      text-decoration: none;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.95rem;
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
    }
    th {
      font-weight: 600;
      color: var(--text-muted);
      background: var(--card-bg);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
    tr:nth-child(even) td {
      background-color: var(--table-stripe);
    }
    tr:hover td {
      background-color: var(--table-hover);
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-success { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid var(--success); }
    .badge-warning { background: rgba(251, 191, 36, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .badge-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .badge-info { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid var(--accent); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
      background: var(--code-bg);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }
    pre code {
      background: none;
      padding: 0;
      border: none;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }
    .choice-label {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-weight: 400;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--table-stripe);
      cursor: pointer;
    }
    .choice-label:hover {
      background: var(--table-hover);
      border-color: var(--accent);
    }
    input[type="text"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      background: var(--code-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    button,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover,
    .btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>{{TITLE}}</h1>
      <div class="meta">
        <span><strong>Generated:</strong> {{DATE}}</span>
        <span><strong>Scope:</strong> {{SCOPE}}</span>
        <span><strong>Status:</strong> <span class="badge badge-info">{{STATUS}}</span></span>
      </div>
    </header>

    {{CONTENT}}

    <footer>
      Generated for review &bull; Open in Firefox
    </footer>
  </div>
</body>
</html>
